<script>
// guarda el número de clicks (empieza en 0)
let contador = 0;

// Función que define lo que ocurre cuando se hace click
function onClick() {
  // Incrementa el contador en 1 cada vez que se ejecuta
  contador++;

  // Muestra un mensaje con el número actual de clicks
  alert('Clicks: ' + contador);
}

// Busca el botón en el HTML usando su id ("btn") y lo guarda en la variable btnEl
let btnEl = document.getElementById('btn');

// Añade un evento al botón:
// cuando el usuario hace click, se ejecuta la función onClick, conecta la función con el botón
btnEl.addEventListener('click', onClick);
</script>
